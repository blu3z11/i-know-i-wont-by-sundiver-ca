<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>sundiver ca</title>
	<style>
		:root {
			color-scheme: light;
			--paper: #ffffff;
			--ink: #000000;
			--background-blur: 6px;
			--text-yellow: #ffe678;
		}

		* {
			box-sizing: border-box;
		}

		html,
		body {
			width: 100%;
			min-height: 100%;
			margin: 0;
		}

		body {
			position: relative;
			isolation: isolate;
			min-height: 100vh;
			overflow: hidden;
			color: var(--ink);
			background-color: var(--paper);
			transition: color 0.3s ease, background-color 0.3s ease;
		}

		body.playing {
			color: var(--text-yellow);
			background-color: #1a1a1a;
		}

		body::before {
			position: fixed;
			inset: -100px;
			z-index: -1;
			background: url("superstar.jpg") center / cover no-repeat;
			content: "";
			filter: blur(var(--background-blur));
			opacity: 0;
			transition: opacity 0.3s ease;
		}

		body.playing::before {
			opacity: 1;
		}

		body.transition::before {
			background: url("sundivernebraska.jpg") center / cover no-repeat;
			opacity: 1;
		}

		h1 {
			margin: 0;
			padding: 22px 24px;
			font-family: Arial, Helvetica, sans-serif;
			font-size: clamp(4rem, 13vw, 11rem);
			font-weight: 700;
			line-height: .85;
			letter-spacing: 0;
			transition: color 0.3s ease, font-family 0.3s ease;
		}

		h1.comic-sans {
			font-family: "Comic Sans MS", cursive;
		}

		h1.garamond {
			font-family: Garamond, serif;
			color: #757694;
		}

		#player {
			position: fixed;
			width: 1px;
			height: 1px;
			border: 0;
			opacity: 0;
			pointer-events: none;
		}

		#playButton {
			position: fixed;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			background-color: #ffc403;
			color: white;
			border: none;
			border-radius: 12px;
			padding: 16px 32px;
			font-size: 18px;
			font-weight: 600;
			cursor: pointer;
			box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
			transition: background-color 0.3s ease;
			z-index: 2;
		}

		#playButton:hover {
			background-color: #ffda03;
		}

		#playButton:active {
			transform: translate(-50%, -50%) scale(0.98);
		}

		#skipButton {
			position: fixed;
			bottom: 16px;
			left: 16px;
			background-color: #757694;
			color: white;
			border: none;
			border-radius: 8px;
			padding: 8px 16px;
			font-size: 12px;
			font-weight: 600;
			cursor: pointer;
			box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
			transition: background-color 0.3s ease;
			z-index: 2;
			display: none;
		}

		#skipButton:hover {
			background-color: #868999;
		}

		#skipButton:active {
			transform: scale(0.98);
		}
	</style>
</head>
<body>
	<h1 id="title">NOW PLAYING - ...</h1>

	<button id="playButton">PLAY</button>
	<button id="skipButton">Skip to Live in Las Vegas</button>

	<div id="player" aria-hidden="true"></div>
	<script src="https://www.youtube.com/iframe_api"></script>
	<script>
		let player;
		let ready = false;
		let transitioned = false;
		const VIDEO_ID = '50dn3IqgRPA';
		const TRANSITION_TIME = 224;

		function onPlayerReady() {
			ready = true;
		}

		function onPlayerStateChange(event) {
			if (event.data === YT.PlayerState.ENDED) {
				player.seekTo(0);
				player.playVideo();
				transitioned = false;
				document.body.classList.remove('transition');
				document.getElementById('title').classList.remove('garamond');
				document.getElementById('title').classList.add('comic-sans');
				document.getElementById('title').textContent = 'NOW PLAYING - I Know I Wont';
				document.getElementById('skipButton').style.display = 'none';
			} else if (event.data === YT.PlayerState.PLAYING) {
				document.getElementById('skipButton').style.display = 'block';
				startTimeCheck();
			}
		}

		function startTimeCheck() {
			const interval = setInterval(() => {
				if (!player || player.getPlayerState() !== YT.PlayerState.PLAYING) {
					clearInterval(interval);
					return;
				}

				const currentTime = player.getCurrentTime();
				if (currentTime >= TRANSITION_TIME && !transitioned) {
					transitioned = true;
					const title = document.getElementById('title');
					document.body.classList.add('transition');
					title.classList.add('garamond');
					title.classList.remove('comic-sans');
					title.textContent = 'NOW PLAYING - Live in Las Vegas';
					document.getElementById('skipButton').style.display = 'none';
					clearInterval(interval);
				}
			}, 100);
		}

		window.onYouTubeIframeAPIReady = function () {
			player = new YT.Player('player', {
				height: '1',
				width: '1',
				videoId: VIDEO_ID,
				playerVars: {
					autoplay: 0,
					controls: 0,
					disablekb: 1,
					fs: 0,
					iv_load_policy: 3,
					modestbranding: 1,
					playsinline: 1,
					rel: 0,
					showinfo: 0
				},
				events: {
					'onReady': onPlayerReady,
					'onStateChange': onPlayerStateChange
				}
			});
		};

		document.getElementById('playButton').addEventListener('click', function () {
			if (ready && player) {
				player.playVideo();
			}
			document.getElementById('title').textContent = 'NOW PLAYING - I Know I Wont';
			document.getElementById('title').classList.add('comic-sans');
			document.getElementById('playButton').style.display = 'none';
			document.body.classList.add('playing');
		});

		document.getElementById('skipButton').addEventListener('click', function () {
			if (player) {
				player.seekTo(TRANSITION_TIME);
				transitioned = true;
				const title = document.getElementById('title');
				document.body.classList.add('transition');
				title.classList.add('garamond');
				title.classList.remove('comic-sans');
				title.textContent = 'NOW PLAYING - Live in Las Vegas';
				document.getElementById('skipButton').style.display = 'none';
			}
		});
	</script>
</body>
</html>

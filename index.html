<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>I Know I Wont</title>
	<style>
		:root {
			color-scheme: light;
			--paper: #ffffff;
			--ink: #ffefbe;
			--background-blur: 6px;
			--lyric-yellow: #ffd200;
			--lyric-black: #000000;
		}

		* {
			box-sizing: border-box;
		}

		html,
		body {
			width: 100%;
			min-height: 100%;
			margin: 0;
		}

		body {
			position: relative;
			isolation: isolate;
			min-height: 100vh;
			overflow: hidden;
			color: var(--ink);
			background-color: var(--paper);
		}

		body::before {
			position: fixed;
			inset: -100px;
			z-index: -1;
			background: url("superstar.jpg") center / cover no-repeat;
			content: "";
			filter: blur(var(--background-blur));
		}

		h1 {
			margin: 0;
			padding: 22px 24px;
			font-family: Arial, Helvetica, sans-serif;
			font-size: clamp(4rem, 13vw, 11rem);
			font-weight: 700;
			line-height: .85;
			letter-spacing: 0;
		}

		#music {
			position: fixed;
			width: 1px;
			height: 1px;
			border: 0;
			opacity: 0;
			pointer-events: none;
		}

		#playButton {
			position: fixed;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			background-color: #ffc403;
			color: white;
			border: none;
			border-radius: 12px;
			padding: 16px 32px;
			font-size: 18px;
			font-weight: 600;
			cursor: pointer;
			box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
			transition: background-color 0.3s ease;
			z-index: 2;
		}

		#playButton:hover {
			background-color: #ffda03;
		}

		#playButton:active {
			transform: translate(-50%, -50%) scale(0.98);
		}

		#lyricsWrap {
			position: fixed;
			left: 0;
			right: 0;
			bottom: 18px;
			display: flex;
			justify-content: center;
			padding: 0 16px;
			opacity: 0;
			visibility: hidden;
			transition: opacity 0.35s ease, visibility 0.35s ease;
			pointer-events: none;
			z-index: 1;
		}

		#lyricsWrap.visible {
			opacity: 1;
			visibility: visible;
		}

		#lyrics {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 10px;
			text-align: center;
			font-family: Arial, Helvetica, sans-serif;
			text-transform: uppercase;
			letter-spacing: 0.08em;
		}

		.lyric-line {
			color: var(--lyric-yellow);
			font-size: clamp(1.2rem, 2.5vw, 2.3rem);
			font-weight: 900;
			line-height: 1.05;
			padding: 0.2em 0.5em;
			border: 3px solid var(--lyric-black);
			border-radius: 12px;
			background: rgba(0, 0, 0, 0.14);
			-webkit-text-stroke: 2px var(--lyric-black);
			text-shadow: 0 2px 0 rgba(0, 0, 0, 0.35);
			paint-order: stroke fill;
			transition: transform 0.3s ease, opacity 0.3s ease, filter 0.3s ease;
			opacity: 0.7;
			filter: saturate(0.9);
		}

		.lyric-line.active {
			opacity: 1;
			transform: scale(1.04);
			filter: saturate(1.2);
		}
	</style>
</head>
<body>
	<h1 id="title">NOW PLAYING - ...</h1>

	<button id="playButton">PLAY</button>

	<div id="lyricsWrap" aria-live="polite">
		<div id="lyrics">
			<div class="lyric-line active">I know I won't</div>
			<div class="lyric-line">I still reach for light</div>
			<div class="lyric-line">every ghost still burns</div>
			<div class="lyric-line">and I come back</div>
		</div>
	</div>

	<div id="music" aria-hidden="true"></div>
	<script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
	<script>
		let controller = null;
		const lyricLines = Array.from(document.querySelectorAll('.lyric-line'));
		let lyricIndex = 0;

		function cycleLyrics() {
			lyricLines.forEach((line, index) => {
				line.classList.toggle('active', index === lyricIndex);
			});
			lyricIndex = (lyricIndex + 1) % lyricLines.length;
		}

		// Autoplay on page load
		window.onSpotifyIframeApiReady = function (IFrameAPI) {
			IFrameAPI.createController(document.getElementById('music'), {
				uri: 'spotify:track:6mU7czKCBwd61T9H3cbsIZ',
				width: '1',
				height: '1'
			}, function (ctrl) {
				controller = ctrl;
				ctrl.addListener('playback_update', function (event) {
					var playback = event.data;
					if (!playback.isPaused && playback.duration > 0 && playback.position >= playback.duration - 500) {
						ctrl.seek(0);
						ctrl.play();
					}
				});
			});
		};

		// Handle play button click
		document.getElementById('playButton').addEventListener('click', function () {
			if (controller) {
				controller.play();
			}
			document.getElementById('title').textContent = 'NOW PLAYING - I Know I Wont by sundiver ca';
			document.getElementById('playButton').style.display = 'none';
			document.getElementById('lyricsWrap').classList.add('visible');
			setInterval(cycleLyrics, 2200);
		});
	</script>
</body>
</html>
